<body>
<div>
  <h1>🍽️ Stasera Dove? si è spostata</h1>
  <p>La nuova casa dell'app è a un indirizzo dedicato.<br>I tuoi dati sono al sicuro: ritroverai tutto.<br>Ricorda di rifare l'icona in Home dal nuovo sito.</p>
  <a href="https://stucchiluca4.github.io/stasera-dove/">Apri la nuova app →</a>
</div>
<script>
try{ if('serviceWorker' in navigator){ navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }); } }catch(e){}
try{ if(window.caches){ caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }); } }catch(e){}
setTimeout(function(){ location.replace('https://stucchiluca4.github.io/stasera-dove/'); }, 150);
</script>
</body>
